[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-tee-preprocessing"
version = "1.0.0"
description = "Leakage-resistant, model-aware clinical preprocessing and bounded training service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "xgboost>=2.1,<4",
  "lightgbm>=4.5,<5",
  "catboost>=1.2,<2",
  "joblib>=1.4,<2",
  "skl2onnx>=1.18,<2",
  "onnxruntime>=1.20,<2",
  "cryptography>=44,<47",
  "coincurve>=20,<22",
  "eth-hash[pycryptodome]>=0.7,<1",
  "eth-abi>=5.2,<6",
  "httpx>=0.28,<1",
  "pydicom>=3,<4",
  "scipy>=1.15,<2",
  "monai>=1.4,<2",
]

[tool.setuptools]
py-modules = [
  "enclave_server",
  "enclave_crypto",
  "dataset_loader",
  "onnx_bundler",
  "stage1_sanitization",
  "stage2_adaptive_profiles",
  "swarm_output",
  "trainer_convergence",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["standards*"]
